<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 650" width="100%" height="100%">
  <!-- Background Icon Box -->
  <rect x="100" y="40" width="300" height="300" rx="70" ry="70" fill="#146a5d" />

  <!-- S-Curve White Line -->
  <path d="M 165 305 C 290 300, 350 230, 240 190 C 140 150, 210 110, 335 115"
        fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Orange/Yellow Dots -->
  <circle cx="165" cy="305" r="20" fill="#e5a832" />
  <circle cx="335" cy="115" r="20" fill="#e5a832" />

  <!-- Main Title Text: Souqna -->
  <text x="250" y="440" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="800" 
        font-size="52" 
        fill="#102536" 
        text-anchor="middle">Souqna</text>

  <!-- Subtitle Text -->
  <text x="250" y="495" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
